services:
  postgres:
    image: postgres:16
    container_name: nba_analytics_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nba_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nba_admin_pw}
      POSTGRES_DB: ${POSTGRES_DB:-nba_analytics}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nba_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nba_analytics_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nba_admin}:${POSTGRES_PASSWORD:-nba_admin_pw}@postgres:5432/${POSTGRES_DB:-nba_analytics}
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: nba_analytics_dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nba_admin}:${POSTGRES_PASSWORD:-nba_admin_pw}@postgres:5432/${POSTGRES_DB:-nba_analytics}
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"

volumes:
  pg_data:
