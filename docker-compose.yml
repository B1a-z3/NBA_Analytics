services:
  postgres:
    image: postgres:16
    container_name: nba_analytics_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nba_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nba_admin_pw}
      POSTGRES_DB: ${POSTGRES_DB:-nba_analytics}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nba_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
